name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fiasco needs GCC 16 (C++26 reflection) and CMake >= 3.30. The official GCC
# image carries the compiler; CMake is installed from PyPI because the image's
# Debian package is older than the project's minimum.
#
# Docker Hub publishes GCC 16 images on Debian trixie. There is no
# gcc:16.2.0-bookworm tag.

jobs:
  build:
    name: GCC 16 build + ctest
    runs-on: ubuntu-latest
    container:
      image: gcc:16.2.0-trixie
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-gcc16-normal-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**', 'tests/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc16-normal-
      - name: Install CMake
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip ninja-build ccache
          pip install --break-system-packages --no-cache-dir cmake
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFIASCO_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan:
    name: ASan
    runs-on: ubuntu-latest
    container:
      image: gcc:16.2.0-trixie
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-gcc16-asan-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**', 'tests/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc16-asan-
      - name: Install CMake
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip ninja-build ccache
          pip install --break-system-packages --no-cache-dir cmake
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFIASCO_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-sanitize-address-use-after-scope -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
      - name: Build
        run: cmake --build build-asan --parallel "$(nproc)"
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-asan --output-on-failure

  tsan:
    name: TSan
    runs-on: ubuntu-latest
    container:
      image: gcc:16.2.0-trixie
      # setarch needs personality(2); Docker's default seccomp profile blocks it.
      options: --security-opt seccomp=unconfined
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-gcc16-tsan-${{ hashFiles('CMakeLists.txt', 'include/**', 'src/**', 'tests/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc16-tsan-
      - name: Install CMake
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip util-linux ninja-build ccache
          pip install --break-system-packages --no-cache-dir cmake
      - name: Configure
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFIASCO_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DFIASCO_TEST_EXECUTOR="setarch;$(uname -m);-R"
      - name: Build
        run: cmake --build build-tsan --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
